databases:
  - name: healthitude-db
    databaseName: healthitude
    plan: free

services:
  # Backend API Web Service
  - type: web
    name: healthitude-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run prisma:generate && npm run prisma:migrate:deploy
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: healthitude-db
          property: connectionString
      - key: COOKIE_SAME_SITE
        value: none
      - key: CORS_ORIGIN
        value: https://healthitude-web.onrender.com,http://localhost:5173
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash

  # Frontend Static Site (SPA)
  - type: web
    name: healthitude-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://healthitude-api.onrender.com
